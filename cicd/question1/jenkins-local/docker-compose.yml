services:
  jenkins:
    image: ghcr.io/imagegenius/jenkins:latest
    container_name: q1-jenkins
    user: "0:0"
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/config
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
